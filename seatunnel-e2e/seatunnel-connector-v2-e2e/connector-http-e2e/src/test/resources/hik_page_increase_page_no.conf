env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Hik {
    plugin_output = "http"
    host = "http://mockserver:1080"
    path = "/api/artemis/vehicle"
    method = "POST"
    format = "json"
    headers {
      "Content-Type" = "application/json"
    }
    ak = "123456"
    sk = "OY9KScw9VbkFJzBNxxVY"
    body = """
      {
        "visitStartTimeBegin":"2025-01-01T00:00",
        "visitStartTimeEnd":"2025-06-16T00:00",
        "pageNo": "${pageNo}",
        "pageSize": "1"
      }
    """
    pageing={
       page_type="PageNumber"
       use_placeholder_replacement = true
       page_field = "pageNo"
       batch_size = 1
       data_field_name="data"
    }
    schema {
      fields {
        plate_number = "string"
        owner_id = "string"
        entry_time = "string"
      }
    }
    json_field {
      plate_number = "$.data[*].plate_number"
      owner_id = "$.data[*].owner_id"
      entry_time = "$.data[*].entry_time"
    }
  }
}

sink {
  Assert {
    plugin_input = "http"
    rules {
      field_rules = [
        {
          field_name = plate_number
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = owner_id
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = entry_time
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
    }
  }
}